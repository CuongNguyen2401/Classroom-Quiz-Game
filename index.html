<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Head Tilting Quiz Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen">
    <div id="app" class="w-full min-h-screen flex flex-col pt-8 pb-8">
      
      <!-- SETUP SCREEN (Teacher Mode) -->
      <div id="setup-screen" class="container mx-auto max-w-5xl bg-white p-8 rounded-2xl shadow-xl flex flex-col md:flex-row gap-8">
        
        <!-- SIDEBAR: Question Library -->
        <div class="w-full md:w-1/3 flex flex-col border-b md:border-b-0 md:border-r border-gray-200 pb-6 md:pb-0 md:pr-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">Quick Presets</h2>
          <div class="flex flex-col gap-3 mb-8">
            <button id="preset-face-btn" class="w-full bg-blue-50 text-blue-600 font-bold py-3 px-4 rounded-lg hover:bg-blue-100 transition shadow-sm border border-blue-200 flex justify-between items-center text-sm">
              <span>Face Mode</span> <span class="text-xs font-semibold opacity-80 border border-blue-200 px-2 py-1 rounded bg-blue-100">5Q / 2 Ans</span>
            </button>
            <button id="preset-hand-btn" class="w-full bg-purple-50 text-purple-600 font-bold py-3 px-4 rounded-lg hover:bg-purple-100 transition shadow-sm border border-purple-200 flex justify-between items-center text-sm">
              <span>Hand Mode</span> <span class="text-xs font-semibold opacity-80 border border-purple-200 px-2 py-1 rounded bg-purple-100">5Q / 4 Ans</span>
            </button>
          </div>

          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">Your Library</h2>
            <span class="text-sm font-semibold text-gray-400 bg-gray-100 px-2 py-1 rounded-md border"><span id="library-count">0</span>/5</span>
          </div>
          <div id="library-container" class="flex-1 overflow-y-auto space-y-3 min-h-[300px]">
            <!-- Library items populated by JS -->
          </div>
        </div>

        <!-- MAIN SETUP AREA -->
        <div class="w-full md:w-2/3 flex flex-col">
          <h1 class="text-4xl font-extrabold text-center text-indigo-600 mb-8">Create Quiz</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Number of Questions:</label>
            <input type="number" id="num-questions-input" min="1" max="50" value="5" 
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Number of Options:</label>
            <select id="num-options-input" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="2" selected>2 Options</option>
              <option value="3">3 Options</option>
              <option value="4">4 Options</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Tracking Mode:</label>
            <select id="tracking-mode-input" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="face" selected>Face Tracking (Roll)</option>
              <option value="hand">Hand Tracking (Fingers)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Time per Question (s):</label>
            <input type="number" id="time-limit-input" min="0" value="10" placeholder="0 = unlimited"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
        </div>

        <!-- Options grid went here -->

        <div class="flex flex-wrap gap-4 mb-8">
          <button id="generate-questions-btn" class="flex-1 min-w-[150px] bg-indigo-50 text-indigo-600 font-bold py-3 px-4 rounded-lg hover:bg-indigo-100 transition shadow-sm">
            Generate Q&A Fields
          </button>
          <button id="save-library-btn" class="flex-1 min-w-[150px] bg-green-50 text-green-600 font-bold py-3 px-4 rounded-lg hover:bg-green-100 transition shadow-sm">
            Save to Library
          </button>
          <button id="clear-all-btn" class="flex-1 min-w-[150px] bg-red-50 text-red-600 font-bold py-3 px-4 rounded-lg hover:bg-red-100 transition shadow-sm">
            Clear All
          </button>
          <button id="load-saved-btn" class="bg-gray-50 text-gray-600 font-bold py-3 px-4 rounded-lg hover:bg-gray-100 transition shadow-sm hidden">
            Load Latest Saved
          </button>
        </div>

        <div id="questions-container" class="space-y-6">
          <!-- Dynamically filled by ui.ts -->
        </div>

        <button id="start-game-btn" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition transform hover:-translate-y-1 hidden text-xl">
          START GAME
        </button>
        </div>
      </div>

      <!-- PLAY SCREEN (Student Mode) -->
      <div id="play-screen" class="container mx-auto max-w-5xl hidden flex-col items-center justify-center flex-1">
        
        <!-- Score & Progress -->
        <div class="w-full flex justify-between items-center mb-6 px-4">
          <div class="text-xl font-bold text-gray-500">
            Question <span id="current-q-num">1</span> of <span id="total-q-num">3</span>
          </div>
          <div id="timer-display" class="text-2xl font-extrabold text-red-500 hidden transition-all">
            ⏳ <span id="time-remaining">10</span>s
          </div>
          <div class="flex items-center gap-4">
            <div class="text-xl font-bold text-indigo-600" id="play-score">Score: 0</div>
            <button id="exit-game-btn" class="bg-red-50 text-red-500 border border-red-200 hover:bg-red-100 font-bold py-1 px-3 rounded-lg transition text-sm shadow-sm">
              Exit
            </button>
          </div>
        </div>

        <!-- Question Text -->
        <div class="w-full bg-white rounded-3xl shadow-lg p-8 mb-8 text-center border-b-8 border-indigo-500">
          <h2 id="question-text" class="text-4xl font-extrabold text-gray-800 break-words leading-tight">
            <!-- Question text goes here -->
          </h2>
        </div>

        <!-- Middle Area: Dynamic Options -> Camera <- Dynamic Options -->
        <div class="w-full flex items-center justify-between gap-6 px-4 min-h-[350px]">
          
          <!-- Options Container Left -->
          <div id="options-container-left" class="flex-1 flex flex-col justify-center gap-4 h-full min-h-[350px]">
            <!-- Dynamically populated by ui.ts -->
          </div>

          <!-- Camera Center Column-->
          <div class="flex flex-col items-center justify-center gap-4 w-96 flex-shrink-0">
             <!-- Top Container -->
             <div id="options-container-top" class="w-full flex empty:hidden min-h-[160px]"></div>

             <!-- Camera Center -->
             <div class="relative w-80 h-80 flex-shrink-0">
               <!-- Progress Ring -->
               <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100">
                 <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="46" fill="transparent"></circle>
                 <circle id="progress-ring" class="text-indigo-500 progress-ring-circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="46" fill="transparent" stroke-dasharray="290" stroke-dashoffset="290"></circle>
               </svg>
               <!-- Camera Video -->
               <div class="absolute inset-2 rounded-full overflow-hidden bg-gray-900 border-4 border-white shadow-inner z-10">
                 <video id="webcam" class="w-full h-full object-cover" autoplay playsinline></video>
                 <canvas id="landmark-canvas" class="absolute inset-0 w-full h-full object-cover z-20"></canvas>
               </div>
               
               <!-- Feedback Overlay -->
               <div id="feedback-overlay" class="absolute inset-2 rounded-full z-30 flex items-center justify-center bg-black bg-opacity-50 opacity-0 transition-opacity duration-300">
                   <span id="feedback-icon" class="text-6xl"></span>
               </div>
             </div>

             <!-- Bottom Container -->
             <div id="options-container-bottom" class="w-full flex empty:hidden min-h-[160px]"></div>
          </div>

          <!-- Options Container Right -->
          <div id="options-container-right" class="flex-1 flex flex-col justify-center gap-4 h-full min-h-[350px]">
            <!-- Dynamically populated by ui.ts -->
          </div>

        </div>
        
        <!-- Loading State for MediaPipe -->
        <div id="loading-indicator" class="mt-8 text-indigo-600 font-bold animate-pulse text-lg py-2 px-6 bg-indigo-50 rounded-full">
          Initializing Head Tracking...
        </div>

      </div>

      <!-- RESULTS SCREEN -->
      <div id="result-screen" class="container mx-auto max-w-4xl hidden bg-white p-8 rounded-3xl shadow-2xl">
        <h1 class="text-5xl font-extrabold text-center text-indigo-600 mb-4">Quiz Complete!</h1>
        <h2 class="text-3xl font-bold text-center text-gray-600 mb-10">
          Final Score: <span id="final-score" class="text-indigo-600"></span>
        </h2>

        <div class="flex justify-center mb-10">
          <button id="export-excel-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition transform hover:-translate-y-1 text-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            EXPORT RESULTS TO EXCEL
          </button>
        </div>

        <div id="results-container" class="space-y-6">
          <!-- Populated by JS -->
        </div>

        <div class="mt-12 flex justify-center gap-6">
          <button id="retry-game-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition transform hover:-translate-y-1">
            Retry Quiz
          </button>
          <button id="restart-game-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-8 rounded-xl shadow-sm transition">
            Create New Quiz
          </button>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
